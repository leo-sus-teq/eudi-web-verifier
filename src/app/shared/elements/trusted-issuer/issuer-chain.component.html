<h2 mat-dialog-title>{{ 'issuerChain.title' | translate }}</h2>

<mat-dialog-content class="mat-typography">
  <div style="padding: 2px">
    <!-- Full sentence (including the two literal, untranslated PEM markers)
         comes from the translation itself via innerHTML rather than being
         split across several translate calls interleaved with static <i>
         tags - much less fragile than reassembling one sentence from three
         translated fragments in two languages with different word order. -->
    <span [innerHTML]="'issuerChain.intro' | translate"></span>
    <br />
    <span>{{ 'issuerChain.clearedNote' | translate }}</span>
  </div>

  <form>
    <mat-form-field class="example-full-width">
      <mat-label>{{ 'issuerChain.fieldLabel' | translate }}</mat-label>
      <textarea
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMaxRows="10"
        [formControl]="issuerChainControl"
        placeholder="-----BEGIN CERTIFICATE-----
...
...
...
-----END CERTIFICATE-----
"
      ></textarea>
      <mat-error *ngIf="issuerChainControl.hasError('invalidCertificate')">
        {{ 'issuerChain.invalidFormatError' | translate }}
      </mat-error>
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close (click)="clear()">{{ 'issuerChain.clearBtn' | translate }}</button>
  <button
    mat-button
    mat-dialog-close
    (click)="save()"
    [disabled]="issuerChainControl.invalid"
  >
    {{ 'actions.save' | translate }}
  </button>
  <button mat-button mat-dialog-close>{{ 'actions.close' | translate }}</button>
</mat-dialog-actions>
