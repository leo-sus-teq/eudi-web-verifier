<div class="vc-verifiable-credential">
  <div>
    <mat-card class="example-card">
      <mat-card-content>
        <p *ngIf="isCrossDevice" style="text-align: center">
          <span class="qr-frame">
            <qrcode
              [qrdata]="deepLinkTxt"
              [allowEmptyString]="false"
              [ariaLabel]="'qrCode.ariaLabel' | translate"
              [cssClass]="'center'"
              [elementType]="'canvas'"
              [errorCorrectionLevel]="'L'"
              [margin]="2"
              [title]="deepLinkTxt"
              [width]="300"
              (qrCodeURL)="onChangeURL($event)"
            />
          </span>
        </p>

        <mat-divider *ngIf="isCrossDevice" />
        <div class="below-qr-code">
          <span *ngIf="isCrossDevice"
            >{{ 'qrCode.scanPrefix' | translate }}
            <a
              [href]="qrCodeDownloadLink"
              download="qrcode"
              [title]="'qrCode.downloadAsImage' | translate"
              >{{ 'qrCode.qrCodeLinkText' | translate }}</a
            >
            {{ 'qrCode.scanSuffix' | translate }}
          </span>
          <p *ngIf="isCrossDevice">{{ 'qrCode.orSeparator' | translate }}</p>
          <a mat-raised-button class="authorize" [href]="deepLinkTxt"
            >{{ 'qrCode.openWithWalletBtn' | translate }}</a
          >

          <details class="link-reveal">
            <summary class="copy-hint">{{ 'qrCode.copyLinkBelow' | translate }}</summary>
            <code class="deep-link-uri">{{ deepLinkTxt }}</code>
          </details>
        </div>

        <mat-divider />
      </mat-card-content>
      <mat-card-actions>
        <button mat-button (click)="openLogs()">{{ 'header.viewTransactionLogs' | translate }}</button>
      </mat-card-actions>
      <mat-card-footer>
        <mat-progress-bar *ngIf="isCrossDevice" mode="indeterminate" />
      </mat-card-footer>
    </mat-card>
  </div>
</div>
