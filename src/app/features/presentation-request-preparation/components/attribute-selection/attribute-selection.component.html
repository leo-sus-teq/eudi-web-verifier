<div class="component-root">
  <ng-container *ngFor="let selection of attestationsSelection">
    <mat-card >
      <mat-card-header>
        <mat-card-title>{{ nameOf(selection.type) | translate }}</mat-card-title>
        <mat-card-subtitle>{{ 'results.formatLabel' | translate: { format: selection.format } }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-actions align="end">
        <button
          *ngIf="isSelectable(selection)"
          mat-stroked-button
          matBadgeColor="accent"
          matBadge="{{ fieldsSelectedNo(selection) }}"
          [matBadgeHidden]="!canShowFieldsSelected(selection.type)"
          (click)="
            popAttributesSelector(
              selection.format!,
              selection.type,
              nameOf(selection.type)
            )
          "
        >
          {{ 'attributeSelection.selectAttributesBtn' | translate }}
        </button>
        <button
          mat-button
          *ngIf="!isSelectable(selection)"
          matBadgeColor="accent"
          matBadge="{{ fieldsSelectedNo(selection) }}"
          [disabled]="true"
        >
          {{ 'attributeSelection.allAttributesSelected' | translate }}
        </button>
      </mat-card-actions>
    </mat-card>
  </ng-container>
</div>
